<title>Arcadia Weltkarte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: full-height app. Top bar, map viewport left, journal panel right (below the map on phones). */
:root {
  --bg: #e9edea;
  --panel: #f7f9f7;
  --raised: #ffffff;
  --fg: #1c2828;
  --muted: #5a6a68;
  --line: #cbd5d1;
  --accent: #2c6a62;
  --accent-fg: #ffffff;
  --accent-soft: #d6e7e3;
  --danger: #a3372b;
  --fog: #2a3236;
  --halo: rgba(247, 249, 247, .92);
  --tree: #2e7445;
  --tree-fg: #f1f8f1;
  --map-ground: #dfe5e2;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(20, 30, 30, .18), 0 4px 14px rgba(20, 30, 30, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181a; --panel: #172124; --raised: #1e2a2e; --fg: #e2e9e6; --muted: #93a4a0;
    --line: #2a3a3d; --accent: #6cbdb0; --accent-fg: #0d1a19; --accent-soft: #1f3a37;
    --danger: #e0786a; --fog: #0b1012; --halo: rgba(23, 33, 36, .92); --tree: #63b97b; --tree-fg: #0d1a12; --map-ground: #0e1416;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 4px 14px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181a; --panel: #172124; --raised: #1e2a2e; --fg: #e2e9e6; --muted: #93a4a0;
  --line: #2a3a3d; --accent: #6cbdb0; --accent-fg: #0d1a19; --accent-soft: #1f3a37;
  --danger: #e0786a; --fog: #0b1012; --halo: rgba(23, 33, 36, .92); --tree: #63b97b; --tree-fg: #0d1a12; --map-ground: #0e1416;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 4px 14px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body);
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 400 1.6rem/1 var(--font-display); letter-spacing: .02em; }
.brand span { color: var(--muted); font-size: .9rem; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--raised); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--panel); border-color: var(--danger); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--raised); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

/* Main area */
.main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
.viewport { position: relative; overflow: hidden; background: var(--map-ground); touch-action: none; cursor: grab; min-width: 0; }
.viewport.dragging { cursor: grabbing; }
.viewport.placing, .viewport.brush { cursor: crosshair; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world img, .world canvas, .world svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.world svg { overflow: visible; pointer-events: none; }
.pins { position: absolute; inset: 0; pointer-events: none; }

.pin {
  position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; padding: 0; background: none; cursor: pointer;
  display: grid; justify-items: center; gap: 2px; transform-origin: 0 0;
}
.pin .badge {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--raised); color: var(--fg); border: 1.5px solid var(--fg); box-shadow: var(--shadow);
}
.pin .badge svg { width: 18px; height: 18px; }
.pin .label {
  font: 400 .95rem/1.1 var(--font-display); white-space: nowrap; color: var(--fg);
  text-shadow: 0 0 3px var(--halo), 0 0 3px var(--halo), 0 0 6px var(--halo); display: none;
}
.pin.t0 .label, .pins.z1 .pin.t1 .label, .pins.z2 .pin .label, .pin.sel .label { display: block; }
.pin.tree .badge { width: 40px; height: 40px; background: var(--tree); color: var(--tree-fg); border: 2px solid var(--tree-fg); box-shadow: 0 0 0 3px var(--tree), var(--shadow); }
.pin.tree .badge svg { width: 26px; height: 26px; }
.pin.tree .label { font-size: 1.02rem; }
.pin.region .label {
  display: block; font: 400 1.25rem/1 var(--font-display); letter-spacing: .14em; opacity: .9;
  text-shadow: 0 0 3px var(--halo), 0 0 6px var(--halo), 0 0 10px var(--halo);
}
.pin.region.sel .label { color: var(--accent); }
.pins.small .pin.tree .label, .pins.small .pin.group .label { display: none; }
.pins.small .pin.region .label { font-size: 1rem; letter-spacing: .08em; }
.listhead { margin: 10px 8px 2px; }
.pin.sel .badge { outline: 3px solid var(--accent); outline-offset: 2px; }
.pin.fogged { opacity: .45; }
.pin.group .badge { width: 30px; height: 30px; border: 2.5px solid #fff; color: #fff; font: 700 .8rem/1 var(--font-body); letter-spacing: .02em; }
.pin.group .label { font: 700 .82rem/1.1 var(--font-body); }

.empty-map {
  position: absolute; inset: 24px; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center;
  border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); padding: 24px;
}
.empty-map h2 { margin: 0; font: 400 1.8rem/1.1 var(--font-display); color: var(--fg); text-wrap: balance; }
.empty-map p { margin: 0; max-width: 42ch; }

.zoom { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 6px; }
.zoom button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-size: 1.2rem; box-shadow: var(--shadow); }
.hint {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--accent);
  border-radius: 999px; padding: 6px 8px 6px 16px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 24px);
}
.fogbar {
  position: absolute; left: 12px; top: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 24px);
}
.fogbar label { display: flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
.status { position: absolute; left: 12px; bottom: 12px; font-size: .82rem; color: var(--muted); background: var(--halo); border-radius: 6px; padding: 3px 8px; }

/* Panel */
.panel { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 12px 8px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.scroll { overflow-y: auto; padding: 14px 16px 24px; display: grid; align-content: start; gap: 12px; min-width: 0; }
.list { display: grid; gap: 2px; }
.item {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-align: left;
  border: 0; background: none; padding: 8px; border-radius: 8px; cursor: pointer; width: 100%;
}
.item:hover { background: var(--accent-soft); }
.item .dot { width: 14px; height: 14px; border-radius: 50%; grid-row: span 2; }
.item .ico { width: 20px; height: 20px; grid-row: span 2; color: var(--muted); }
.item strong { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.item small { grid-column: 2; color: var(--muted); font-size: .86rem; min-width: 0; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.detail { display: grid; gap: 12px; align-content: start; min-width: 0; }
.detail h2 { margin: 2px 0 0; font: 400 1.7rem/1.1 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.detail p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.back { justify-self: start; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 6px; font-size: .88rem; background: var(--raised); cursor: pointer; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.note { border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; background: var(--accent-soft); display: grid; gap: 4px; }
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 7px 10px; }
.field textarea { min-height: 90px; resize: vertical; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatches button[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--panel) inset; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 7px 10px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--panel); padding: 8px 14px; border-radius: 8px; z-index: 20; max-width: calc(100% - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 58% 42%; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="bar">
  <div class="brand"><h1>Arcadia</h1><span>Weltkarte</span></div>
  <div class="tools" id="tools"></div>
</header>
<div class="main">
  <div class="viewport" id="vp" aria-label="Weltkarte">
    <div class="world" id="world">
      <img id="mapimg" alt="Karte von Arcadia" hidden>
      <svg id="trails" aria-hidden="true"></svg>
      <canvas id="fog" aria-hidden="true"></canvas>
    </div>
    <div class="pins" id="pins"></div>
    <div class="empty-map" id="emptymap" hidden></div>
    <div class="fogbar" id="fogbar" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="zoom">
      <button id="zin" aria-label="Hineinzoomen">+</button>
      <button id="zout" aria-label="Herauszoomen">−</button>
      <button id="zfit" aria-label="Ganze Karte zeigen">⤢</button>
    </div>
    <div class="status" id="status">Lädt …</div>
  </div>
  <aside class="panel">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" id="tab-groups" aria-selected="true">Runden</button>
      <button role="tab" id="tab-places" aria-selected="false">Orte</button>
    </div>
    <div class="scroll" id="panel"></div>
  </aside>
</div>
<input type="file" id="mapfile" accept="image/png,image/jpeg,image/webp" class="sr">
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
function svgIcon(d) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 20 20"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", d); p.setAttribute("fill", "currentColor"); s.append(p); return s;
}

const TYPES = {
  stadt:     { label: "Stadt",       major: true,  d: "M3 17V8l2-2 2 2v3h2V6l1-2 1 2v5h2V8l2-2 2 2v9z" },
  burg:      { label: "Burg",        major: true,  d: "M4 17V5h2v2h2V5h4v2h2V5h2v12h-5v-4H9v4z" },
  dorf:      { label: "Dorf",        major: false, d: "M3 17V9l7-5 7 5v8h-5v-5H8v5z" },
  taverne:   { label: "Taverne",     major: false, d: "M5 6h8v11H5zM13 8h2.5a2.5 2.5 0 0 1 0 5H13v-1.6h2.4a.9.9 0 0 0 0-1.8H13z" },
  dungeon:   { label: "Dungeon",     major: false, d: "M3 17c0-8 3-12 7-12s7 4 7 12h-4c0-4-1-6-3-6s-3 2-3 6z" },
  ruine:     { label: "Ruine",       major: false, d: "M4 15h12v2H4zM5 7h2v8H5zM9 10h2v5H9zM13 6h2v9h-2z" },
  landmarke: { label: "Landmarke",   major: false, d: "M10 3l2 5h5l-4 3 2 5-5-3-5 3 2-5-4-3h5z" },
  weltenbaum:{ label: "Weltenbaum",  major: true,  d: "M10 1.5c-2.6 0-4.6 1.8-4.8 4.1C3.4 6.2 2 7.9 2 9.9c0 2.4 2 4.3 4.4 4.3h2.3V19h2.6v-4.8h2.3c2.4 0 4.4-1.9 4.4-4.3 0-2-1.4-3.7-3.2-4.3C14.6 3.3 12.6 1.5 10 1.5z" },
  region:    { label: "Region",      major: true,  d: "M3 5l4-2 6 2 4-2v12l-4 2-6-2-4 2z" },
};
const TYPE_ORDER = ["region", "weltenbaum", "stadt", "burg", "dorf", "taverne", "dungeon", "ruine", "landmarke"];
const tierOf = (type) => (type === "region" || type === "weltenbaum" ? 0 : type === "stadt" || type === "burg" ? 1 : 2);
const COLORS = ["#c0492f", "#2f74b5", "#7353c2", "#b98a0c", "#23885f", "#c2448c", "#14808c", "#5f6d22"];

const S = {
  places: new Map(), groups: new Map(), notes: new Map(), settings: {}, fog: { strokes: [] },
  sel: null, tab: "groups", filter: "", typeFilter: "", mode: "view", tool: "move", brush: 0.04,
  playerPreview: false, showTrails: true, placing: false, canWrite: false, isDM: false,
  live: false, confirmDel: false, loaded: false,
};
let db = null, assets = null;
const view = { s: 1, tx: 0, ty: 0, fit: 1 };
let W = 1600, H = 1100;

const vp = $("vp"), world = $("world"), pins = $("pins"), img = $("mapimg"), fogC = $("fog"), trails = $("trails");

/* ---------- toast ---------- */
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

/* ---------- storage ---------- */
const COLS = { places: "places", groups: "groups", notes: "dmnotes" };
async function put(kind, id, obj) {
  if (!db) { S[kind].set(id, obj); renderAll(); return; }
  try { await db.collection(COLS[kind]).doc(id).set(obj); } catch (e) { onErr(e); }
}
async function del(kind, id) {
  if (!db) { S[kind].delete(id); renderAll(); return; }
  try { await db.collection(COLS[kind]).doc(id).delete(); } catch (e) { onErr(e); }
}
async function putDoc(path, obj, local) {
  if (!db) { local(); renderAll(); return; }
  try { await db.doc(path).set(obj); } catch (e) { onErr(e); }
}
function onErr(e) {
  const c = e && e.code;
  if (c === "invalid_argument") { S.canWrite = false; S.mode = "view"; toast("Du kannst diese Karte nur ansehen."); renderAll(); }
  else if (c === "quota_exceeded" || c === "resource_exhausted") toast("Der Speicher der Karte ist voll. Lösche alte Einträge oder Nebelstriche.");
  else toast("Speichern hat nicht geklappt. Versuch es gleich noch einmal.");
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- view transform ---------- */
function applyView() {
  world.style.width = W + "px"; world.style.height = H + "px";
  world.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.s})`;
  positionPins();
}
function fit() {
  const r = vp.getBoundingClientRect();
  view.fit = Math.min(r.width / W, r.height / H) * 0.96;
  view.s = view.fit; view.tx = (r.width - W * view.s) / 2; view.ty = (r.height - H * view.s) / 2;
  applyView();
}
function zoomAt(cx, cy, f) {
  const ns = Math.min(Math.max(view.s * f, view.fit * 0.6), Math.max(view.fit * 10, 3));
  f = ns / view.s;
  view.tx = cx - (cx - view.tx) * f; view.ty = cy - (cy - view.ty) * f; view.s = ns; applyView();
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function flyTo(nx, ny) {
  const r = vp.getBoundingClientRect();
  const s = Math.max(view.s, view.fit * 2.2);
  const to = { s, tx: r.width / 2 - nx * W * s, ty: r.height / 2 - ny * H * s };
  if (reduceMotion) { Object.assign(view, to); applyView(); return; }
  const from = { ...view }, t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / 380), e = 1 - Math.pow(1 - k, 3);
    view.s = from.s + (to.s - from.s) * e; view.tx = from.tx + (to.tx - from.tx) * e; view.ty = from.ty + (to.ty - from.ty) * e;
    applyView(); if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function toNorm(clientX, clientY) {
  const r = vp.getBoundingClientRect();
  return { x: (clientX - r.left - view.tx) / (view.s * W), y: (clientY - r.top - view.ty) / (view.s * H) };
}
const clamp01 = (v) => Math.min(1, Math.max(0, v));

/* ---------- fog ---------- */
const playerView = () => !S.isDM || S.playerPreview;
const fogOn = () => !!S.settings.fog;
let fogCtx = fogC.getContext("2d");
function fogColor() { return getComputedStyle(document.documentElement).getPropertyValue("--fog").trim() || "#222"; }
function sizeFog() {
  const k = Math.min(1, 2048 / Math.max(W, H));
  fogC.width = Math.round(W * k); fogC.height = Math.round(H * k);
}
function drawFog(extra) {
  const c = fogCtx, fw = fogC.width, fh = fogC.height;
  c.clearRect(0, 0, fw, fh);
  if (!fogOn() || !S.settings.mapAsset) { fogC.hidden = true; return; }
  fogC.hidden = false;
  fogC.style.opacity = playerView() ? "1" : "0.55";
  const col = fogColor();
  c.globalCompositeOperation = "source-over"; c.fillStyle = col; c.fillRect(0, 0, fw, fh);
  const list = extra ? S.fog.strokes.concat([extra]) : S.fog.strokes;
  for (const st of list) {
    if (st.m === "R") { c.globalCompositeOperation = "source-over"; c.clearRect(0, 0, fw, fh); continue; }
    if (st.m === "H") { c.globalCompositeOperation = "source-over"; c.fillStyle = col; c.fillRect(0, 0, fw, fh); continue; }
    c.globalCompositeOperation = st.m === "r" ? "destination-out" : "source-over";
    c.strokeStyle = col; c.fillStyle = col; c.lineCap = "round"; c.lineJoin = "round";
    const lw = st.r * 2 * fw, p = st.p;
    if (p.length === 2) { c.beginPath(); c.arc(p[0] * fw, p[1] * fh, lw / 2, 0, Math.PI * 2); c.fill(); continue; }
    c.lineWidth = lw; c.beginPath(); c.moveTo(p[0] * fw, p[1] * fh);

/* ---------- map image ---------- */
let curAsset = null, localMapUrl = null;
function applyMap() {
  const a = S.settings.mapAsset;
  const nw = S.settings.w || 1600, nh = S.settings.h || 1100;
  const sizeChanged = nw !== W || nh !== H;
  W = nw; H = nh;
  if (a !== curAsset) { curAsset = a; if (a) { img.src = a === "local" ? localMapUrl : "/_blob/" + a; img.hidden = false; } else { img.removeAttribute("src"); img.hidden = true; } }
  if (sizeChanged || !fogC.width) { sizeFog(); fit(); }
}

function renderAll() { applyMap(); drawFog(); renderTools(); renderOverlays(); renderTrails(); renderPins(); renderPanel(); }

/* theme changes recolor the fog */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawFog());
new MutationObserver(() => drawFog()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

sizeFog(); fit(); renderAll();
(async () => {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [user, dbNs] = await Promise.all([use("user"), use("db")]);
  db = dbNs;
  let canEdit = false;
  try { canEdit = user ? await user.canEdit() : false; } catch {}
  S.isDM = canEdit || !db; S.canWrite = S.isDM;
  if (canEdit) assets = await use("assets");
  S.live = !!db;
  if (!db) { S.loaded = true; renderAll(); return; }
  const fail = () => { S.loaded = true; renderAll(); };
  let pending = 4;
  const ready = () => { if (--pending <= 0) { S.loaded = true; } renderAll(); };
  const once = (fn) => { let done = false; return (...a) => { fn(...a); if (!done) { done = true; ready(); } else renderAll(); }; };
  db.doc("world/settings").onSnapshot(once((s) => { S.settings = s.exists ? { ...s.data() } : {}; }), fail);
  db.doc("world/fog").onSnapshot(once((s) => { S.fog = s.exists ? { strokes: (s.data().strokes || []).slice() } : { strokes: [] }; }), fail);
  db.collection("places").onSnapshot(once((q) => { S.places = new Map(q.docs.map((d) => [d.id, { ...d.data() }])); }), fail);
